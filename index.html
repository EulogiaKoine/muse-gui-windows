<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muse-gui</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%232f6fed"/><path d="M9 9h14v10H15l-5 5v-5H9z" fill="white"/></svg>'>
<link rel="stylesheet" href="/static/style.css?v=__GUI_VERSION__">
</head>
<body>
<aside>
<div id="sidehead"><h1>muse-gui</h1><button id="sidetoggle" type="button" title="사이드바 접기" aria-label="사이드바 접기"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button></div>
<p id="args">연결 중…</p>
<button id="newchat" type="button"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>New Chat</span></button>
<div id="convs"></div>
<div id="ctx" hidden>
<button type="button" data-act="pin">상단 고정</button>
<button type="button" data-act="rename">이름 변경</button>
<button type="button" data-act="del">삭제</button>
</div>
<div id="sidefoot"><button id="gear" type="button" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.4"/></svg></button></div>
</aside>
<div id="ovl" hidden><div id="modal" role="dialog" aria-label="설정">
<div class="mhead"><h2>설정</h2><button type="button" class="iconbtn" id="mclose" title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="mbody">
<div class="tabs" id="mtabs" role="tablist">
<button type="button" data-tab="gen" class="sel">일반</button><button type="button" data-tab="acct">계정</button><button type="button" data-tab="usage">사용량</button><button type="button" data-tab="skills">스킬</button>
</div>
<section data-pane="gen" class="on">
<h3>테마</h3>
<div class="row" id="themes">
<button type="button" class="optbtn" data-th="light">라이트</button><button type="button" class="optbtn" data-th="dark">다크</button>
</div>
<h3>팔레트</h3>
<div class="row" id="accents">
<button type="button" class="sw" data-ac="blue" title="블루" style="background:#2f6fed"></button><button type="button" class="sw" data-ac="green" title="그린" style="background:#178a4c"></button><button type="button" class="sw" data-ac="amber" title="앰버" style="background:#b45309"></button>
</div>
</section>
<section data-pane="acct">
<h3>계정</h3>
<p id="acct">불러오는 중…</p>
<h3>API 토큰</h3>
<div class="row"><code id="tok" class="grow">…</code><button type="button" class="iconbtn" id="tokcopy" title="토큰 복사"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>
<h3>로그인 관리</h3>
<p class="hint">로그인·로그아웃은 터미널에서만 (브라우저 승인 / 자격 삭제).<br><code>muse login</code> · <code>muse logout</code></p>
</section>
<section data-pane="usage">
<h3>총 사용량</h3>
<div class="row"><a class="optbtn" id="dashlink" href="https://dev.meta.ai" target="_blank" rel="noopener" title="Meta 개발자 콘솔">dev.meta.ai 콘솔 열기</a></div>
<div class="urange" id="urange" role="group" aria-label="기간">
<button type="button" data-r="7" class="sel">7d</button><button type="button" data-r="30">30d</button><button type="button" data-r="90">90d</button>
</div>
<div id="ucards"></div>
<div id="usagebox">불러오는 중…</div>
</section>
<section data-pane="skills">
<h3>에이전트 스킬</h3>
<p class="hint">muse CLI 스킬 목록. 토글로 활성화/비활성화를 변경한다. (대화형 세션에 적용, headless exec는 스킬 미로드)</p>
<div class="row"><button type="button" class="optbtn" id="skilladd">＋ 새 스킬</button></div>
<div id="skillform" hidden>
<label>이름 <input id="skname" placeholder="my-skill" autocomplete="off"></label>
<label>설명 <input id="skdesc" placeholder="언제 사용하는지 한 줄로" autocomplete="off"></label>
<textarea id="skbody" placeholder="SKILL.md 본문 (마크다운)"></textarea>
<div class="row"><button type="button" class="optbtn" id="sksave">저장</button><button type="button" class="optbtn" id="skcancel">취소</button></div>
</div>
<div id="skillbox">불러오는 중…</div>
</section>
</div>
</div></div>
<main>
<header><span id="status"></span><span id="meta">연결 중…</span><span id="cwd" title="작업 디렉터리"></span></header>
<div id="lobby"><h1>muse-gui</h1><p>WSL의 muse 에이전트와 대화하세요</p><div class="chips" id="chips"></div></div>
<div id="chat" aria-live="polite"></div>
<form id="f">
<div id="slash" role="listbox"></div>
<div id="inwrap"><textarea id="in" placeholder="메시지 입력 (Ctrl+Enter 전송, Enter 줄바꿈, / 자동완성)" autocomplete="off"></textarea><div id="feats"></div></div>
<button type="submit" title="전송 (Ctrl+Enter)" aria-label="전송"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
</form>
<footer><button id="plus" type="button" title="기능 추가" aria-label="기능 추가">+</button><div id="plusmenu" hidden></div><label>모델 <select id="model"></select></label><label>effort <select id="effort"></select></label></footer>
</main>
<script src="/static/app.js?v=__GUI_VERSION__"></script>
</body>
</html>
